<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - LALIT FASHION COLLECTION</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #ff6a00, #ee0979);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.signup-box {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h1 {
  text-align: center;
  color: #ee0979;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 12px 0 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #ff6a00, #ee0979);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

.login-link {
  text-align: center;
  margin-top: 18px;
}

.login-link a {
  color: #ee0979;
  font-weight: bold;
  text-decoration: none;
}

.home {
  text-align: center;
  margin-top: 15px;
}

.home a {
  color: #555;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="signup-box">

  <h1>Create Account</h1>
  <p class="subtitle">Join LALIT FASHION COLLECTION</p>

  <form id="signupForm">

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name" required>

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <label>Mobile Number</label>
    <input type="tel" id="mobile" placeholder="Enter mobile number" required>

    <label>Password</label>
    <input type="password" id="password" placeholder="Create password" required>

    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" placeholder="Confirm password" required>

    <button type="submit">Create Account</button>

  </form>

  <div class="message" id="message"></div>

  <div class="login-link">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

  <div class="home">
    <a href="index.html">← Back to Home</a>
  </div>

</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {

  e.preventDefault();

  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirmPassword").value;
  let message = document.getElementById("message");

  if (password !== confirmPassword) {
    message.style.color = "red";
    message.innerHTML = "Passwords do not match!";
    return;
  }

  message.style.color = "green";
  message.innerHTML = "Account form submitted successfully!";

});
</script>

</body>
</html>
