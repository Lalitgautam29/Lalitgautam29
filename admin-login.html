<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - LALIT FASHION COLLECTION</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #111827, #374151);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 400px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.logo {
  text-align: center;
  font-size: 50px;
  margin-bottom: 10px;
}

h1 {
  text-align: center;
  color: #111827;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #111827, #374151);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

.back {
  text-align: center;
  margin-top: 20px;
}

.back a {
  color: #374151;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">🔐</div>

  <h1>Admin Login</h1>

  <p class="subtitle">
    LALIT FASHION COLLECTION
  </p>

  <form id="adminLoginForm">

    <label>Admin Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
    >

    <button type="submit">
      🔐 Login as Admin
    </button>

  </form>

  <div id="message"></div>

  <div class="back">
    <a href="index.html">← Back to Store</a>
  </div>

</div>


<script>

document.getElementById("adminLoginForm").addEventListener("submit", function(e) {

  e.preventDefault();

  let message = document.getElementById("message");

  message.style.color = "#ee0979";

  message.innerHTML =
    "Admin authentication will be connected with the real backend.";

});

</script>

</body>
</html>
