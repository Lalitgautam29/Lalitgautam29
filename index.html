<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LALIT FASHION COLLECTION</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: linear-gradient(90deg, #111, #333);
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffcc00;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #ff512f, #dd2476);
      color: white;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: white;
      color: #dd2476;
      padding: 12px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 40px 5%;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    .category {
      background: white;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      text-decoration: none;
      color: #222;
      font-weight: bold;
    }

    .category:hover {
      transform: translateY(-3px);
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 30px;
      }

      nav {
        width: 100%;
        text-align: center;
      }

      nav a {
        display: inline-block;
        margin: 5px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">LALIT FASHION COLLECTION</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="cart.html">Cart 🛒</a>
  </nav>
</header>

<section class="hero">
  <h1>Wear Your Style</h1>
  <p>Trendy Fashion & Sports Wear</p>
  <a href="#categories" class="btn">Shop Now</a>
</section>

<section class="section" id="categories">
  <h2>Shop By Category</h2>

  <div class="categories">

    <a class="category" href="tshirts.html">
      👕<br><br>
      T-Shirts
    </a>

    <a class="category" href="trackpants.html">
      👖<br><br>
      Track Pants
    </a>

    <a class="category" href="shorts.html">
      🩳<br><br>
      Shorts
    </a>

    <a class="category" href="jerseys.html">
      ⚽<br><br>
      Jerseys
    </a>

    <a class="category" href="sportswear.html">
      🏃<br><br>
      Sports Wear
    </a>

  </div>
</section>

<footer>
  <p>© 2026 LALIT FASHION COLLECTION</p>
  <p>All Rights Reserved</p>
</footer>

</body>
</html>
