<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - LALIT FASHION COLLECTION</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f5f5;
}

header {
  background: linear-gradient(90deg, #ff6a00, #ee0979);
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  font-size: 24px;
}

nav {
  margin-top: 12px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 7px;
  font-weight: bold;
}

.profile {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.avatar {
  width: 90px;
  height: 90px;
  background: linear-gradient(135deg, #ff6a00, #ee0979);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  margin: 0 auto 15px;
}

h2 {
  text-align: center;
  margin-bottom: 25px;
}

.info {
  margin-bottom: 15px;
}

.info strong {
  display: block;
  color: #555;
  margin-bottom: 5px;
}

.info p {
  background: #f5f5f5;
  padding: 12px;
  border-radius: 8px;
}

.buttons {
  display: grid;
  gap: 12px;
  margin-top: 25px;
}

.buttons a,
.logout {
  text-align: center;
  padding: 13px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 15px;
}

.orders {
  background: #ff6a00;
  color: white;
}

.cart {
  background: #ee0979;
  color: white;
}

.home {
  background: #333;
  color: white;
}

.logout {
  background: #ddd;
  color: #222;
}

#logoutMessage {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>👗 LALIT FASHION COLLECTION</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="tshirts.html">T-Shirts</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="profile">

  <div class="avatar">👤</div>

  <h2>My Profile</h2>

  <div class="info">
    <strong>Full Name</strong>
    <p>Customer Name</p>
  </div>

  <div class="info">
    <strong>Email</strong>
    <p>customer@example.com</p>
  </div>

  <div class="info">
    <strong>Mobile Number</strong>
    <p>+91 XXXXX XXXXX</p>
  </div>

  <div class="buttons">

    <a class="orders" href="orders.html">
      📦 My Orders
    </a>

    <a class="cart" href="cart.html">
      🛒 My Cart
    </a>

    <a class="home" href="index.html">
      🏠 Back to Home
    </a>

    <button class="logout" onclick="logout()">
      🚪 Logout
    </button>

  </div>

  <div id="logoutMessage"></div>

</div>

<footer>
  © 2026 LALIT FASHION COLLECTION
</footer>

<script>
function logout() {
  document.getElementById("logoutMessage").style.color = "green";
  document.getElementById("logoutMessage").innerHTML =
    "Logout button is working. Real login system will be connected with backend.";
}
</script>

</body>
</html>
